# Temporary judging preview. Free instance; no disk or paid infrastructure.
# Source, sessions, graphs, and usage counters reset on sleep/restart.
services:
  - type: web
    name: rehearsal-judge-demo
    runtime: docker
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: REHEARSAL_PUBLIC
        value: "1"
      - key: REHEARSAL_STATE_DIR
        value: /data/rehearsal
      - key: REHEARSAL_TEMPORARY_DEMO
        value: "1"
      - key: REHEARSAL_REPO_GUEST_RUNS_PER_DAY
        value: "4"
      - key: REHEARSAL_REPO_PEER_RUNS_PER_DAY
        value: "12"
      - key: REHEARSAL_APP_ORIGIN
        sync: false
      - key: REHEARSAL_SESSION_KEY
        sync: false
      - key: REHEARSAL_OPERATOR_TOKEN
        generateValue: true
      - key: BACKBOARD_API_KEY
        sync: false
      - key: REHEARSAL_SANDBOX
        value: vercel
      - key: REHEARSAL_SANDBOX_BROKER_SECRET
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
